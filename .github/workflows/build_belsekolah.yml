name: Build BelSekolah APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Memeriksa proyek BelSekolah"
          ls -la
          echo "Memeriksa folder app"
          find app -maxdepth 5 -type f
